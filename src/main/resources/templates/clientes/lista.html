<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: mensagens}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/web/clientes/novo}">Novo cliente</a>
    </div>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th class="text-end">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.telefone}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/web/clientes/{id}/editar(id=${c.id})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/web/clientes/{id}/excluir(id=${c.id})}"
                          onsubmit="return confirm('Excluir este cliente?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="5" class="text-center text-muted">Nenhum cliente cadastrado.</td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
