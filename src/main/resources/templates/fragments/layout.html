<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Sistema de Chamados'">Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div th:fragment="mensagens" class="container mt-3">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    </div>
    
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Sistema de Chamados</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/web/chamados}">Chamados</a>
            <a class="nav-link" th:href="@{/web/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/web/categorias}">Categorias</a>
            <a class="nav-link" th:href="@{/web/tecnicos}">Técnicos</a>
        </div>
    </div>
</nav>
</body>
</html>
